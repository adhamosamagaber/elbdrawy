<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELBDRAWY Enterprise (V32)</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* --- THEME --- */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --primary: #4cc9f0; --success: #06d6a0; --danger: #ef476f; --warning: #ffd166; --info: #4895ef;
        }
        body {
            font-family: 'Cairo', sans-serif; margin: 0; padding: 0;
            background: linear-gradient(45deg, #0f0c29, #302b63, #24243e);
            background-size: 400% 400%; animation: gradientBG 15s ease infinite;
            color: white; min-height: 100vh; overflow-x: hidden;
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* --- UI COMPONENTS --- */
        .glass-panel {
            background: var(--glass-bg); backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border); border-radius: 16px;
            box-shadow: var(--glass-shadow); padding: 15px; margin-bottom: 20px;
        }

        .main-content { padding: 20px; max-width: 1600px; margin: 0 auto; display: none; }
        
        /* Dashboard Grid */
        .dashboard-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        @media (max-width: 900px) { .dashboard-grid { grid-template-columns: 1fr; } }

        .stats-dashboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; text-align: center; }
        .stat-value { font-size: 1.8em; font-weight: 900; color: var(--primary); display: block;}
        .stat-label { font-size: 0.8em; opacity: 0.7; }

        /* Leaderboard */
        .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .leaderboard-table th { text-align: right; color: var(--warning); padding: 5px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .leaderboard-table td { padding: 8px 5px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .rank-1 { color: #ffd700; text-shadow: 0 0 10px #ffd700; } 

        .controls-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .action-btn {
            background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border);
            color: white; padding: 8px 15px; border-radius: 8px; cursor: pointer;
            transition: 0.2s; display: flex; align-items: center; gap: 8px; font-family: 'Cairo';
        }
        .action-btn:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }
        .btn-primary { background: var(--primary); color: #000; border: none; }
        .btn-success { background: var(--success); color: #000; border: none; }
        .btn-danger { color: var(--danger); border-color: var(--danger); }
        
        .search-box {
            background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
            color: white; padding: 10px 20px; border-radius: 30px;
            width: 300px; text-align: center; font-family: 'Cairo'; outline: none;
        }
        .search-box:focus { border-color: var(--primary); }

        /* Bands & Cards */
        .bands-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; align-items: start; }
        .band-column {
            background: rgba(0,0,0,0.2); border-radius: 12px; overflow: hidden;
            border: 1px solid var(--glass-border); transition: 0.3s;
        }
        .band-column.collapsed .band-body { display: none; }
        .band-header {
            background: linear-gradient(90deg, rgba(76, 201, 240, 0.1), transparent);
            padding: 10px 15px; font-weight: bold;
            display: flex; justify-content: space-between; align-items: center;
        }
        
        .account-card {
            background: rgba(255,255,255,0.03); margin: 10px; padding: 12px;
            border-radius: 10px; border: 1px solid transparent; position: relative; transition: 0.3s;
            border-right: 3px solid transparent; /* For Tags */
        }
        .account-card:hover { background: rgba(255,255,255,0.07); transform: translateY(-3px); }
        
        /* TAGS COLORS */
        .tag-red { border-right-color: var(--danger) !important; background: linear-gradient(90deg, rgba(239, 71, 111, 0.1), transparent); }
        .tag-green { border-right-color: var(--success) !important; background: linear-gradient(90deg, rgba(6, 214, 160, 0.1), transparent); }
        .tag-yellow { border-right-color: var(--warning) !important; background: linear-gradient(90deg, rgba(255, 209, 102, 0.1), transparent); }

        .acc-note { font-size: 0.8em; color: var(--warning); margin-top: 5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .acc-price { position: absolute; top: 12px; left: 12px; font-size: 0.9em; color: var(--success); font-weight: bold; }

        .acc-name { color: var(--primary); font-weight: bold; font-size: 1.1em; cursor: pointer; }
        .data-text { font-family: monospace; color: #ccc; font-size: 0.9em; margin: 5px 0; }
        
        .counter-box { display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.3); border-radius: 8px; padding: 5px; margin-top: 10px; }
        .count-btn { width: 30px; height: 30px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; color: white; display: flex; align-items: center; justify-content: center; }
        .btn-plus { background: var(--success); } .btn-minus { background: var(--danger); }
        .count-val { font-size: 1.2em; font-weight: bold; color: white; width: 40px; text-align: center; }
        
        .card-actions { display: flex; justify-content: space-between; margin-top: 10px; }
        .icon-btn { background: none; border: none; color: #777; cursor: pointer; transition: 0.2s; }
        .icon-btn:hover { color: white; transform: scale(1.2); }

        /* Login & Modals */
        #loginScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f0c29; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .login-glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(16px); padding: 40px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); text-align: center; width: 320px; }
        .login-input, .modal-input, .modal-select { width: 100%; padding: 12px; margin: 10px 0; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); border-radius: 8px; color: white; text-align: center; font-family: 'Cairo'; outline: none; box-sizing: border-box;}
        .modal-select { text-align: right; background: #1a1a2e; }
        .glow-btn { width: 100%; padding: 12px; background: linear-gradient(90deg, #4cc9f0, #4361ee); border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; font-family: 'Cairo'; }
        
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 998; display: none; }
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); width: 90%; max-width: 600px; background: #1a1a2e; border: 1px solid var(--glass-border); border-radius: 16px; padding: 25px; z-index: 999; display: none; opacity: 0; transition: 0.3s; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .modal.active { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        textarea { width: 100%; height: 300px; background: #0f0c29; border: 1px solid #333; color: var(--success); padding: 15px; border-radius: 8px; font-family: monospace; }

        .tag-option { display: inline-block; width: 20px; height: 20px; border-radius: 50%; margin: 0 5px; cursor: pointer; border: 2px solid transparent; }
        .tag-option.selected { border-color: white; transform: scale(1.2); }

        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: white; color: #000; padding: 12px 25px; border-radius: 30px; font-weight: bold; z-index: 2000; transition: 0.4s; opacity: 0; }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .version-tag { position: fixed; top: 10px; right: 10px; background: #059669; color: white; padding: 5px 10px; border-radius: 5px; font-weight: bold; z-index: 99999; }
        .news-ticker { background: rgba(0,0,0,0.5); color: var(--warning); padding: 8px 0; font-weight: bold; white-space: nowrap; overflow: hidden; }
        .ticker-content { display: inline-block; animation: ticker 20s linear infinite; padding-left: 100%; }
        @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(100%); } }
    </style>
</head>
<body>
    
    <div class="version-tag">V32 - ENTERPRISE</div>
    <div class="news-ticker"><div class="ticker-content" id="newsTicker">>>> V32: تم إضافة سلة المحذوفات + نظام الملاحظات + تسعير المخزون + لوحة المتصدرين 🏆</div></div>

    <div id="loginScreen">
        <div class="login-glass">
            <h2 style="color:white; margin-bottom:5px;">ELBDRAWY SYSTEM</h2>
            <input type="text" id="usernameInput" class="login-input" placeholder="اسم المستخدم">
            <input type="password" id="passInput" class="login-input" placeholder="كلمة المرور">
            <button class="glow-btn" onclick="checkLogin()">دخول 🔓</button>
            <div id="loginError" style="color:var(--danger); margin-top:10px; display:none;">⛔ دخول مرفوض!</div>
        </div>
    </div>

    <div class="main-content" id="mainApp">
        <div class="header-container">
            <div class="dashboard-grid">
                <div class="glass-panel stats-dashboard">
                    <div class="stat-item"><span class="stat-value" id="stat-acc">0</span><span class="stat-label">أكونتات</span></div>
                    <div class="stat-item"><span class="stat-value" id="stat-wealth" style="color:var(--warning)">0</span><span class="stat-label">عدد كلي</span></div>
                    <div class="stat-item"><span class="stat-value" id="stat-value" style="color:var(--success)">0$</span><span class="stat-label">قيمة المخزون 💲</span></div>
                    <div class="stat-item"><span class="stat-value" id="currentUserDisplay" style="color:var(--info)">-</span><span class="stat-label">المستخدم</span></div>
                </div>
                
                <div class="glass-panel" style="overflow-y: auto; max-height: 150px;">
                    <h4 style="margin:0 0 10px 0; color:var(--warning); text-align:center"><i class="fas fa-trophy"></i> لوحة المتصدرين (Live)</h4>
                    <table class="leaderboard-table" id="leaderboardTable">
                        <tr><td>جاري التحميل...</td></tr>
                    </table>
                </div>
            </div>

            <div class="glass-panel controls-bar">
                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                    <button class="action-btn btn-success" onclick="openAddModal()"><i class="fas fa-plus-circle"></i> إضافة (Alt+N)</button>
                    <button class="action-btn btn-danger" onclick="openTrash()"><i class="fas fa-trash-restore"></i> السلة ♻️</button>
                    <button class="action-btn btn-primary" onclick="openEditor()"><i class="fas fa-terminal"></i> المحرر</button>
                    <button class="action-btn" onclick="copyAllCombos()"><i class="fas fa-copy"></i> نسخ الكل</button>
                </div>
                <input type="text" id="searchInput" class="search-box" placeholder="🔎 بحث (Alt+F)..." onkeyup="renderAccounts()">
                <button class="action-btn" style="color:var(--danger); border-color:var(--danger)" onclick="logout()">خروج</button>
            </div>
        </div>
        <div id="app" class="bands-container"></div>
    </div>

    <div class="overlay" id="overlay" onclick="closeModals()"></div>
    
    <div id="addModal" class="modal">
        <h3 style="color: white; margin-top:0;">⚡ إضافة سريعة</h3>
        <select id="newAccBand" class="modal-select"></select>
        <input type="text" id="newAccName" class="modal-input" placeholder="اسم الأكونت">
        <input type="text" id="newAccUser" class="modal-input" placeholder="اليوزر (أو الصق user:pass)" oninput="smartPaste(this)">
        <input type="text" id="newAccPass" class="modal-input" placeholder="الباسورد">
        <input type="number" id="newAccCount" class="modal-input" placeholder="الرصيد" value="0">
        <input type="number" id="newAccPrice" class="modal-input" placeholder="السعر (اختياري) 💲">
        <button class="glow-btn" onclick="confirmAddAccount()">إضافة ✅</button>
    </div>

    <div id="detailsModal" class="modal">
        <h3 style="color: white; margin-top:0;">🏷️ تعديل التفاصيل</h3>
        <input type="hidden" id="editAccId">
        <label>السعر ($)</label>
        <input type="number" id="editPrice" class="modal-input" placeholder="0">
        <label>ملاحظة</label>
        <input type="text" id="editNote" class="modal-input" placeholder="اكتب ملحوظة...">
        <label>الحالة (Tag)</label>
        <div style="text-align:center; margin: 10px 0;">
            <span class="tag-option" style="background:var(--danger)" onclick="selectTag('red')"></span>
            <span class="tag-option" style="background:var(--success)" onclick="selectTag('green')"></span>
            <span class="tag-option" style="background:var(--warning)" onclick="selectTag('yellow')"></span>
            <span class="tag-option" style="border:1px solid #555" onclick="selectTag('')">❌</span>
        </div>
        <input type="hidden" id="editTag">
        <button class="glow-btn" onclick="saveDetails()">حفظ التعديلات 💾</button>
    </div>

    <div id="trashModal" class="modal">
        <h3 style="color: var(--danger); margin-top:0;">♻️ سلة المحذوفات</h3>
        <div id="trashList" style="max-height: 300px; overflow-y: auto; margin-bottom:10px;"></div>
        <button class="action-btn btn-danger" style="width:100%; justify-content:center" onclick="emptyTrash()">إفراغ السلة نهائياً 🔥</button>
    </div>

    <div id="editorModal" class="modal">
        <h3 style="color: white; margin-top:0;">📝 المحرر</h3>
        <textarea id="rawDataInput"></textarea>
        <button class="glow-btn" onclick="saveData()">حفظ ونشر 📡</button>
    </div>

    <div id="toast"><i class="fas fa-check-circle"></i> <span id="toastMsg">تم!</span></div>

    <script>
        // --- SOUNDS ---
        const Sounds = {
            coin: new Audio('https://www.myinstants.com/media/sounds/super-mario-coin.mp3'),
            click: new Audio('https://www.myinstants.com/media/sounds/click_x.mp3'),
            trash: new Audio('https://www.myinstants.com/media/sounds/discord-leave.mp3'),
            magic: new Audio('https://www.myinstants.com/media/sounds/fairy-glitter-86721.mp3'),
            login: new Audio('https://www.myinstants.com/media/sounds/discord-join.mp3')
        };
        Object.values(Sounds).forEach(s => s.volume = 0.3);

        // --- CONFIG ---
        const DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1461396528089403582/cAmKpW39f8Y_qHmF8PbwHqH4FAlxuQy0s9HRNFA9LOqs8Kn-cfaWriZYNu_BSqL8PXvr";
        const firebaseConfig = { apiKey: "AIzaSyBCDyJtEVXt9-UXyuT7mQBmElCNer2neNE", authDomain: "elbdrawy.firebaseapp.com", projectId: "elbdrawy", storageBucket: "elbdrawy.firebasestorage.app", messagingSenderId: "599472644586", appId: "1:599472644586:web:b13c2430770691c8ea1293", measurementId: "G-0E5QET6D7D" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- AUTH ---
        const APP_PASS = "ELBADRAWY";
        const ALLOWED = ["Adham Zng", "Belal Zng", "Amar Zng", "Adham Normal", "Belal Kersha"];
        let currentUser = localStorage.getItem('currentUser');
        
        function checkLogin() {
            const u = document.getElementById('usernameInput').value.trim();
            const p = document.getElementById('passInput').value;
            const validUser = ALLOWED.find(user => user.toLowerCase() === u.toLowerCase());
            if (validUser && p === APP_PASS) {
                currentUser = validUser; localStorage.setItem('currentUser', currentUser);
                Sounds.login.play(); initApp(); sendDiscord(`🟢 **${currentUser}** logged in (V32)`);
            } else {
                document.getElementById('loginError').style.display = 'block'; Sounds.trash.play();
            }
        }
        function logout() { localStorage.removeItem('currentUser'); location.reload(); }
        if(currentUser && ALLOWED.includes(currentUser)) initApp();
        function initApp() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('currentUserDisplay').innerText = currentUser;
            loadLeaderboard();
        }

        // --- LOGIC ---
        let database = [];
        let trashBin = [];

        db.ref('shared_data').on('value', snap => {
            const val = snap.val() || "";
            document.getElementById('rawDataInput').value = val;
            parseData(val);
        });

        function parseData(text) {
            database = [];
            trashBin = [];
            let currentBand = null;
            const lines = text.split('\n');
            if(lines.length > 0 && lines[0].startsWith('>>>')) document.getElementById('newsTicker').innerText = lines[0].replace('>>>', '').trim();

            lines.forEach(line => {
                line = line.trim();
                if(!line || line.startsWith('>>>')) return;
                
                if(line.startsWith('### TRASH ###')) {
                    currentBand = { name: "TRASH", accs: [] }; // Special handling
                } else if(line.startsWith('#')) {
                    currentBand = { name: line.substring(1).trim(), accs: [], id: Math.random().toString(36) };
                    if(currentBand.name !== "TRASH") database.push(currentBand);
                } else if(line.includes(':')) {
                    const p = line.split(':');
                    // Format: Name:User:Pass:Count:Price:Note:Tag
                    const acc = {
                        id: 'acc_' + Math.random().toString(36).substr(2, 9),
                        name: p[0].trim(),
                        user: (p[1] || p[0]).trim(),
                        pass: (p[2] || "").trim(),
                        count: parseInt(p[3] || 0),
                        price: parseFloat(p[4] || 0),
                        note: (p[5] || "").trim(),
                        tag: (p[6] || "").trim()
                    };
                    if(currentBand) {
                        if(currentBand.name === "TRASH") trashBin.push(acc);
                        else currentBand.accs.push(acc);
                    }
                }
            });
            render();
        }

        function render() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const container = document.getElementById('app');
            container.innerHTML = "";
            let totalAcc = 0, totalWealth = 0, totalValue = 0;

            database.forEach(band => {
                const visible = band.accs.filter(a => a.name.toLowerCase().includes(search) || a.user.toLowerCase().includes(search));
                if(visible.length === 0 && search) return;

                let bandWealth = 0;
                let html = visible.map(acc => {
                    totalAcc++; totalWealth += acc.count; bandWealth += acc.count;
                    totalValue += (acc.price * acc.count); // Calculate Inventory Value

                    let cardClass = "account-card";
                    if(acc.count === 0) cardClass += " out-of-stock";
                    else if(acc.count < 3) cardClass += " low-stock";
                    if(acc.tag) cardClass += ` tag-${acc.tag}`;

                    let noteHtml = acc.note ? `<span class="acc-note"><i class="fas fa-sticky-note"></i> ${acc.note}</span>` : '';
                    let priceHtml = acc.price > 0 ? `<span class="acc-price">${acc.price}$</span>` : '';

                    return `
                    <div class="${cardClass}" id="${acc.id}">
                        ${priceHtml}
                        <div class="acc-top" style="justify-content: flex-end;">
                            <button class="icon-btn" onclick="openDetails('${acc.id}', '${band.name}')" title="تعديل التفاصيل"><i class="fas fa-pen"></i></button>
                        </div>
                        <div style="text-align:center; margin-top:-20px">
                            <span class="acc-name" onclick="copy('${acc.name}', 'magic')">${acc.name}</span>
                            <div class="data-text">${acc.user}</div>
                            ${noteHtml}
                        </div>
                        <div class="counter-box">
                            <button class="count-btn btn-minus" onclick="update('${acc.id}', -1, '${acc.name}', '${band.name}')"><i class="fas fa-minus"></i></button>
                            <span class="count-val" id="val_${acc.id}">${acc.count}</span>
                            <button class="count-btn btn-plus" onclick="update('${acc.id}', 1, '${acc.name}', '${band.name}')"><i class="fas fa-plus"></i></button>
                        </div>
                        <div class="card-actions">
                            <button class="action-btn" style="font-size:0.7em; padding:4px" onclick="copy('${acc.user}:${acc.pass}', 'magic')">Combo</button>
                            <button class="icon-btn" style="color:var(--danger)" onclick="moveToTrash('${acc.id}', '${acc.name}', '${band.name}')"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>`;
                }).join('');

                container.innerHTML += `
                <div class="band-column">
                    <div class="band-header">
                        <div class="band-info" onclick="this.parentElement.parentElement.classList.toggle('collapsed')" style="flex-grow:1; cursor:pointer">
                            <span>${band.name} <small>(${visible.length})</small> <span style="color:var(--warning)">${bandWealth}💰</span></span>
                            <i class="fas fa-chevron-down" style="margin-right:5px"></i>
                        </div>
                        <button class="quick-add-btn" onclick="openAddModal('${band.name}')" title="إضافة"><i class="fas fa-plus"></i></button>
                    </div>
                    <div class="band-body">${html}</div>
                </div>`;
            });

            document.getElementById('stat-acc').innerText = totalAcc;
            document.getElementById('stat-wealth').innerText = totalWealth;
            document.getElementById('stat-value').innerText = totalValue.toLocaleString() + '$';
        }

        // --- NEW FEATURES ACTIONS ---
        
        // 1. Recycle Bin
        function moveToTrash(id, name, bandName) {
            const band = database.find(b => b.name === bandName);
            const idx = band.accs.findIndex(a => a.id === id);
            if(idx > -1) {
                const acc = band.accs[idx];
                trashBin.push(acc); // Add to RAM trash
                band.accs.splice(idx, 1); // Remove from RAM band
                regenerateText(); // Save both changes
                Sounds.trash.play();
                logToAll("🗑️ سلة", `نقل [${name}] إلى سلة المحذوفات`);
            }
        }

        function openTrash() {
            const list = document.getElementById('trashList');
            list.innerHTML = trashBin.length === 0 ? "<div style='color:#777; text-align:center'>السلة فارغة ✅</div>" : "";
            
            trashBin.forEach(acc => {
                list.innerHTML += `
                <div style="background:rgba(255,255,255,0.05); padding:10px; margin-bottom:5px; border-radius:8px; display:flex; justify-content:space-between; align-items:center;">
                    <span>${acc.name} (${acc.count})</span>
                    <button class="action-btn btn-success" onclick="restoreFromTrash('${acc.name}')" style="font-size:0.8em">استرجاع</button>
                </div>`;
            });
            
            document.getElementById('trashModal').style.display='block';
            setTimeout(()=>document.getElementById('trashModal').classList.add('active'),10);
            document.getElementById('overlay').style.display='block';
        }

        function restoreFromTrash(accName) {
            const idx = trashBin.findIndex(a => a.name === accName);
            if(idx > -1) {
                const acc = trashBin[idx];
                trashBin.splice(idx, 1);
                // Return to first band by default or create "Restored" band
                if(database.length > 0) database[0].accs.push(acc);
                else database.push({name: "Restored", accs: [acc]});
                
                regenerateText();
                closeModals();
                Sounds.magic.play();
                logToAll("♻️ استرجاع", `تم استرجاع [${accName}]`);
            }
        }

        function emptyTrash() {
            if(confirm("هل أنت متأكد؟ سيتم حذف هذه الأكونتات نهائياً!")) {
                trashBin = [];
                regenerateText();
                closeModals();
                Sounds.trash.play();
                logToAll("🔥 تنظيف", "تم إفراغ سلة المحذوفات");
            }
        }

        // 2. Notes & Details
        function openDetails(id, bandName) {
            const band = database.find(b => b.name === bandName);
            const acc = band.accs.find(a => a.id === id);
            
            document.getElementById('editAccId').value = JSON.stringify({id, bandName});
            document.getElementById('editPrice').value = acc.price || 0;
            document.getElementById('editNote').value = acc.note || "";
            document.getElementById('editTag').value = acc.tag || "";
            
            // UI Selection
            document.querySelectorAll('.tag-option').forEach(el => el.classList.remove('selected'));
            
            document.getElementById('detailsModal').style.display='block';
            setTimeout(()=>document.getElementById('detailsModal').classList.add('active'),10);
            document.getElementById('overlay').style.display='block';
        }

        function selectTag(color) {
            document.getElementById('editTag').value = color;
            document.querySelectorAll('.tag-option').forEach(el => el.classList.remove('selected'));
            event.target.classList.add('selected');
        }

        function saveDetails() {
            const meta = JSON.parse(document.getElementById('editAccId').value);
            const price = document.getElementById('editPrice').value;
            const note = document.getElementById('editNote').value;
            const tag = document.getElementById('editTag').value;

            const band = database.find(b => b.name === meta.bandName);
            const acc = band.accs.find(a => a.id === meta.id);
            
            acc.price = parseFloat(price) || 0;
            acc.note = note.replace(/:/g, '-'); // Prevent format break
            acc.tag = tag;

            regenerateText();
            closeModals();
            Sounds.coin.play();
        }

        // 3. Leaderboard (Auto-calculated from Firebase Logs)
        function loadLeaderboard() {
            db.ref('system_logs').limitToLast(100).on('value', snap => {
                const stats = {};
                snap.forEach(s => {
                    const log = s.val();
                    if(!stats[log.user]) stats[log.user] = 0;
                    stats[log.user]++; // Simple activity score
                });

                const sorted = Object.entries(stats).sort((a,b) => b[1] - a[1]);
                let html = "";
                sorted.forEach((entry, i) => {
                    const rankClass = i === 0 ? "rank-1" : "";
                    const icon = i === 0 ? "👑" : (i===1 ? "🥈" : (i===2?"🥉":""));
                    html += `<tr>
                        <td class="${rankClass}">${icon} ${entry[0]}</td>
                        <td><b>${entry[1]}</b> عملية</td>
                    </tr>`;
                });
                document.getElementById('leaderboardTable').innerHTML = html || "<tr><td>لا توجد بيانات</td></tr>";
            });
        }

        // --- CORE FUNCTIONS ---
        function update(id, change, name, band) {
            let found = false, oldV = 0, newV = 0;
            const valEl = document.getElementById(`val_${id}`);
            if(valEl) { valEl.classList.remove('pop-anim'); void valEl.offsetWidth; valEl.classList.add('pop-anim'); }

            database.forEach(b => b.accs.forEach(a => {
                if(a.id === id) { oldV = a.count; a.count += change; if(a.count < 0) a.count = 0; newV = a.count; found = true; }
            }));

            if(found) {
                change > 0 ? Sounds.coin.play() : Sounds.click.play(); regenerateText();
                const type = change > 0 ? "➕ زيادة" : "➖ خصم";
                logToAll(type, `[${band}] ${name} (${oldV} -> ${newV})`);
            }
        }

        function regenerateText() {
            let t = "";
            const currentRaw = document.getElementById('rawDataInput').value;
            if(currentRaw.startsWith('>>>')) t += currentRaw.split('\n')[0] + "\n\n";
            
            database.forEach(b => {
                t += `# ${b.name}\n`;
                b.accs.forEach(a => {
                    // Save: Name:User:Pass:Count:Price:Note:Tag
                    t += `${a.name} : ${a.user} : ${a.pass} : ${a.count} : ${a.price} : ${a.note} : ${a.tag}\n`;
                });
                t += "\n";
            });
            
            // Append Trash
            if(trashBin.length > 0) {
                t += `### TRASH ###\n`;
                trashBin.forEach(a => {
                    t += `${a.name} : ${a.user} : ${a.pass} : ${a.count} : ${a.price} : ${a.note} : ${a.tag}\n`;
                });
            }

            db.ref('shared_data').set(t);
        }

        // --- HELPERS ---
        function smartPaste(input) {
            const val = input.value;
            if(val.includes(':')) {
                const parts = val.split(':');
                input.value = parts[0].trim();
                document.getElementById('newAccPass').value = parts[1].trim();
                Sounds.magic.play();
            }
        }

        function openAddModal(preSelectedBand = null) {
            const select = document.getElementById('newAccBand');
            select.innerHTML = "";
            database.forEach(b => {
                const opt = document.createElement('option');
                opt.value = b.name; opt.innerText = b.name;
                select.appendChild(opt);
            });
            if(preSelectedBand) select.value = preSelectedBand;
            
            document.getElementById('newAccName').value = "";
            document.getElementById('newAccUser').value = "";
            document.getElementById('newAccPass').value = "";
            document.getElementById('newAccCount').value = "0";
            document.getElementById('newAccPrice').value = "";

            document.getElementById('addModal').style.display='block';
            setTimeout(()=>document.getElementById('addModal').classList.add('active'),10);
            document.getElementById('overlay').style.display='block';
        }

        function confirmAddAccount() {
            const bandName = document.getElementById('newAccBand').value;
            const name = document.getElementById('newAccName').value.trim();
            const user = document.getElementById('newAccUser').value.trim();
            const pass = document.getElementById('newAccPass').value.trim();
            const count = document.getElementById('newAccCount').value.trim();
            const price = document.getElementById('newAccPrice').value.trim();

            if(!name || !user) { alert("البيانات ناقصة!"); return; }

            const band = database.find(b => b.name === bandName);
            if(band) {
                band.accs.push({
                    name, user, pass, 
                    count: parseInt(count) || 0,
                    price: parseFloat(price) || 0,
                    note: "", tag: "",
                    id: 'acc_' + Math.random().toString(36).substr(2, 9)
                });
                regenerateText();
                logToAll("🆕 إضافة", `[${bandName}] تمت إضافة ${name}`);
                Sounds.magic.play(); closeModals();
            }
        }

        function logToAll(action, details) {
            const time = new Date().toLocaleString('ar-EG', {hour:'2-digit', minute:'2-digit'});
            db.ref('system_logs').push({user: currentUser, action, details, time});
            sendDiscord(`**[${currentUser}]** ${action}: ${details}`);
        }

        function sendDiscord(msg) {
            fetch(DISCORD_WEBHOOK, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ username: "System V32", avatar_url: "https://cdn-icons-png.flaticon.com/512/3665/3665923.png", content: msg }) }).catch(()=>{});
        }

        function copy(text, soundType) { navigator.clipboard.writeText(text); if(soundType) Sounds[soundType].play(); showToast("تم النسخ بنجاح"); }
        function showToast(msg) { const t = document.getElementById('toast'); document.getElementById('toastMsg').innerText = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }
        function copyAllCombos() { let t = ""; database.forEach(b => b.accs.forEach(a => t += `${a.user}:${a.pass}\n`)); copy(t, 'magic'); }
        function saveData() { const txt = document.getElementById('rawDataInput').value; db.ref('shared_data').set(txt); closeModals(); Sounds.magic.play(); logToAll("🛠️ تعديل", "تحديث شامل من المحرر"); }
        function openEditor() { document.getElementById('editorModal').style.display='block'; setTimeout(()=>document.getElementById('editorModal').classList.add('active'),10); document.getElementById('overlay').style.display='block'; }
        function closeModals() { document.querySelectorAll('.modal').forEach(m => { m.classList.remove('active'); setTimeout(()=>m.style.display='none',300); }); document.getElementById('overlay').style.display='none'; }
        
        document.onkeydown = function(evt) { 
            if (evt.key === "Escape") closeModals(); 
            if (evt.altKey && evt.key === 'n') { evt.preventDefault(); openAddModal(); } 
            if (evt.altKey && evt.key === 'f') { evt.preventDefault(); document.getElementById('searchInput').focus(); }
        };
    </script>
</body>
</html>
