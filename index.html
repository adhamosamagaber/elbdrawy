            const msg = snap.val();
            if(msg && msg.time > Date.now() - 10000) {
                document.getElementById('broadcastText').innerText = msg.text;
                document.getElementById('broadcastPopup').classList.add('active');
                setTimeout(()=>document.getElementById('broadcastPopup').classList.remove('active'),5000);
            }
        });

        function checkLogin() {
            const uInput = document.getElementById('usernameInput').value.trim().toLowerCase();
            const pInput = document.getElementById('passInput').value;
            const userKey = Object.keys(USERS).find(k => k === uInput);
            if (userKey && USERS[userKey].p === pInput) {
                db.ref(`users_status/${userKey}/banned`).once('value', snap => {
                    if(snap.val() === true) { alert("حساب محظور!"); } else {
                        currentUser = userKey; currentRole = USERS[userKey].role;
                        localStorage.setItem('currentUser', currentUser); localStorage.setItem('currentRole', currentRole);
                        Sounds.login.play(); initApp();
                    }
                });
            } else { document.getElementById('loginError').style.display = 'block'; Sounds.trash.play(); }
        }

        function logout(reload = true) { localStorage.clear(); if(reload) location.reload(); }

        function initApp() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('currentUserDisplay').innerText = currentUser + (currentRole==='admin' ? ' 👑' : '');
            
            if(currentRole === 'admin') {
                document.querySelectorAll('.admin-only').forEach(el => el.classList.add('show-admin'));
                document.getElementById('dashboardGrid').classList.add('admin-view'); // 3 Cols
                document.getElementById('spyPanel').style.display = 'flex'; // Show Spy Panel
                loadSpyDashboard();
            }
            loadLeaderboard();
        }

        // --- SPY DASHBOARD (PANEL) ---
        function loadSpyDashboard() {
            db.ref('presence').on('value', snap => {
                const list = document.getElementById('spyTableMini'); list.innerHTML = "";
                snap.forEach(s => {
                    const u = s.key; const d = s.val();
                    const isOnline = (Date.now() - d.last_active) < 10000;
                    const statusClass = isOnline ? 'st-online' : 'st-idle';
                    if(u !== currentUser) {
                        list.innerHTML += `<tr>
                            <td><span class="status-badge ${statusClass}"></span> ${u}</td>
                            <td class="spy-actions">
                                <button class="btn-kick" onclick="kickUser('${u}')">K</button>
                                <button class="btn-ban" onclick="banUser('${u}')">B</button>
                            </td>
                        </tr>`;
                    }
                });
            });
        }
        function kickUser(u) { if(confirm(`طرد ${u}؟`)) db.ref(`users_status/${u}/kicked`).set(true); }
        function banUser(u) { if(confirm(`حظر ${u}؟`)) db.ref(`users_status/${u}/banned`).set(true); }

        // --- NEW XP LEADERBOARD ---
        function loadLeaderboard() { 
            db.ref('system_logs').limitToLast(500).on('value', snap => {
                const xp = {};
                snap.forEach(s => {
                    const log = s.val();
                    if(!xp[log.user]) xp[log.user] = 0;
                    if(log.action.includes("بيع")) xp[log.user] += 50;
                    else if(log.action.includes("إضافة")) xp[log.user] += 10;
                    else if(log.action === "ADMIN_XP") xp[log.user] += (log.xpValue || 0); 
                    else xp[log.user] += 2;
                });
                
                const sorted = Object.entries(xp).sort((a,b) => b[1] - a[1]);
                const container = document.getElementById('xpContainer');
                container.innerHTML = "";

                sorted.forEach((entry, i) => {
                    const points = entry[1];
                    let rankClass = "rank-noob";
                    let icon = "🌱";
                    
                    if(points > 1000) { rankClass = "rank-god"; icon = "⚡"; }
                    else if(points > 500) { rankClass = "rank-legend"; icon = "👑"; }
                    else if(points > 100) { rankClass = "rank-pro"; icon = "🛡️"; }
                    
                    const progress = Math.min((points / 1000) * 100, 100);
                    
                    container.innerHTML += `
                    <div class="rank-row ${rankClass}">
                        <div class="rank-icon">${icon}</div>
                        <div class="rank-info">
                            <span class="rank-name">${entry[0].toUpperCase()}</span>
                            <div class="rank-bar-bg"><div class="rank-bar-fill" style="width:${progress}%"></div></div>
                        </div>
                        <div class="rank-xp">${points} XP</div>
                    </div>`;
                });
            });
        }

        // --- ADMIN MODAL (TEAM) ---
        function openTeamCards() {
            db.ref('system_logs').limitToLast(500).once('value', snap => {
                const stats = {};
                snap.forEach(s => { const log = s.val(); if(!stats[log.user]) stats[log.user] = 0; if(log.action.includes("بيع")) stats[log.user]+=50; else if(log.action.includes("إضافة")) stats[log.user]+=10; else if(log.action==="ADMIN_XP") stats[log.user]+=log.xpValue; else stats[log.user]+=2; });
                const container = document.getElementById('teamCardsContainer'); container.innerHTML = "";
                Object.keys(USERS).forEach(user => {
                    const xp = stats[user] || 0; let rank = "🌱";
                    if(xp > 1000) rank = "⚡"; else if(xp > 500) rank = "👑"; else if(xp > 100) rank = "🛡️";
                    container.innerHTML += `<div class="fifa-card"><div style="font-weight:bold; font-size:1.2em">${rank}</div><div style="font-weight:900; margin:5px 0">${user.toUpperCase()}</div><div style="font-size:2em; font-weight:bold">${xp}</div><div style="font-size:0.8em; opacity:0.8">XP Total</div><div class="xp-controls"><button class="action-btn" onclick="adjustXP('${user}')" style="width:100%; font-size:0.8em"><i class="fas fa-cog"></i> تعديل</button></div></div>`;
                });
                openModal('teamModal');
            });
        }
        function adjustXP(u) { const a = prompt("XP Amount:"); if(a && !isNaN(a)) { db.ref('system_logs').push({user:u, action:"ADMIN_XP", details:"Admin Fix", time:new Date().toLocaleString('ar-EG'), xpValue:parseInt(a)}); alert("تم"); closeModals(); } }

        // --- CORE FUNCTIONS ---
        db.ref('shared_data').on('value', snap => { document.getElementById('rawDataInput').value = snap.val()||""; parseData(snap.val()||""); });
        function parseData(text) {
            database = []; trashBin = [];
            text.split('\n').forEach(line => {
                line = line.trim(); if(!line || line.startsWith('>>>')) return;
                if(line.startsWith('### TRASH ###')) { database.push({name: "TRASH", accs: [], price: 0}); } 
                else if(line.startsWith('#')) { let p=line.substring(1).split(':'); database.push({name:p[0].trim(), accs:[], id:Math.random(), price:parseFloat(p[1])||0}); }
                else if(line.includes(':')) {
                    let p=line.split(':'); const acc={id:'acc_'+Math.random().toString(36).substr(2,9), name:p[0].trim(), user:(p[1]||p[0]).trim(), pass:(p[2]||"").trim(), count:parseInt(p[3])||0, note:(p[4]||"").trim(), tag:(p[5]||"").trim(), originalBand:(p[6]||"").trim()};
                    let lastBand = database[database.length-1];
                    if(lastBand) { if(lastBand.name==="TRASH") trashBin.push(acc); else lastBand.accs.push(acc); }
                }
            });
            database = database.filter(b => b.name !== "TRASH");
            render();
        }

        function render() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const container = document.getElementById('app'); container.innerHTML = "";
            let tAcc=0, tWealth=0, tVal=0;
            database.forEach(band => {
                const visible = band.accs.filter(a => a.name.toLowerCase().includes(search) || a.user.toLowerCase().includes(search));
                if(visible.length===0 && search) return;
                let bWealth=0;
                let html = visible.map(acc => {
                    tAcc++; tWealth+=acc.count; bWealth+=acc.count;
                    let cls = "account-card"; if(acc.count===0) cls+=" out-of-stock"; else if(acc.count<3) cls+=" low-stock"; if(acc.tag) cls+=` tag-${acc.tag}`;
                    return `<div class="${cls}" id="${acc.id}"><div class="acc-top" style="justify-content:flex-end"><button class="icon-btn" onclick="openDetails('${acc.id}', '${band.name}')"><i class="fas fa-pen"></i></button></div><div style="text-align:center; margin-top:-20px"><span class="acc-name" onclick="copy('${acc.name}', 'magic')">${acc.name}</span><div class="data-text">${acc.user}</div>${acc.note ? `<span class="acc-note">${acc.note}</span>` : ''}</div><div class="counter-box"><button class="count-btn btn-minus" onclick="update('${acc.id}', -1, '${acc.name}', '${band.name}')">-</button><span class="count-val" id="val_${acc.id}">${acc.count}</span><button class="count-btn btn-plus" onclick="update('${acc.id}', 1, '${acc.name}', '${band.name}')">+</button></div><div class="card-actions"><button class="action-btn btn-sell" style="flex:1; font-size:0.8em" onclick="sellAccount('${acc.id}', '${acc.name}', '${band.name}')">بيع 💰</button><button class="action-btn" style="flex:1; font-size:0.8em; background:rgba(255,255,255,0.1)" onclick="copy('${acc.user}:${acc.pass}', 'magic')">Combo</button><button class="icon-btn" style="color:var(--danger)" onclick="moveToTrash('${acc.id}', '${acc.name}', '${band.name}')"><i class="fas fa-trash"></i></button></div></div>`;
                }).join('');
                tVal += bWealth * band.price;
                container.innerHTML += `<div class="band-column"><div class="band-header"><div onclick="this.parentElement.parentElement.classList.toggle('collapsed')" style="flex:1;cursor:pointer;display:flex;align-items:center"><span>${band.name}</span> <span class="badge-card" title="كروت">${visible.length}</span> <span class="badge-stock" title="مخزون">${bWealth}</span></div><div onclick="event.stopPropagation()"><input type="number" class="band-price-input" value="${band.price}" onchange="updateBandPrice('${band.name}',this.value)" placeholder="$"><span class="price-display">${bWealth*band.price}$</span><button class="quick-add-btn" onclick="openAddModal('${band.name}')">+</button></div></div><div class="band-body">${html}</div></div>`;
            });
            document.getElementById('stat-acc').innerText=tAcc; document.getElementById('stat-wealth').innerText=tWealth; document.getElementById('stat-value').innerText=tVal+"$";
        }

        // Common Functions
        function update(id, c, n, b) { let f=0; database.forEach(x=>x.accs.forEach(a=>{if(a.id===id){let o=a.count; a.count+=c; if(a.count<0)a.count=0; f=1; logToAll(c>0?"➕":"➖", `${n} (${o}->${a.count})`);}})); if(f) { c>0?Sounds.coin.play():Sounds.click.play(); regenerateText(); } }
        function sellAccount(id, n, bName) { if(!confirm("بيع؟"))return; const b=database.find(x=>x.name===bName); const idx=b.accs.findIndex(x=>x.id===id); if(idx>-1){ let a=b.accs[idx]; a.originalBand=bName; a.tag="sold"; trashBin.push(a); b.accs.splice(idx,1); regenerateText(); Sounds.sale.play(); logToAll("💰", `بيع ${n}`); } }
        function moveToTrash(id, n, bName) { const b=database.find(x=>x.name===bName); const idx=b.accs.findIndex(x=>x.id===id); if(idx>-1){ let a=b.accs[idx]; a.originalBand=bName; trashBin.push(a); b.accs.splice(idx,1); regenerateText(); Sounds.trash.play(); } }
        function updateBandPrice(b, p) { const x=database.find(z=>z.name===b); if(x){x.price=parseFloat(p)||0; regenerateText();} }
        function regenerateText() {
            let t = document.getElementById('rawDataInput').value.split('\n')[0].startsWith('>>>') ? document.getElementById('rawDataInput').value.split('\n')[0]+"\n\n" : "";
            database.forEach(b => { t += `# ${b.name} : ${b.price}\n`; b.accs.forEach(a => { t += `${a.name} : ${a.user} : ${a.pass} : ${a.count} : ${a.note} : ${a.tag} : ${a.originalBand||''}\n`; }); t += "\n"; });
            if(trashBin.length > 0) { t += `### TRASH ###\n`; trashBin.forEach(a => { t += `${a.name} : ${a.user} : ${a.pass} : ${a.count} : ${a.note} : ${a.tag} : ${a.originalBand||''}\n`; }); }
            db.ref('shared_data').set(t); db.ref('history').push({text:t, time:new Date().toLocaleString()});
        }
        function openAddModal(b) { const s=document.getElementById('newAccBand'); s.innerHTML=""; database.forEach(x=>s.innerHTML+=`<option value="${x.name}">${x.name}</option>`); if(b) s.value=b; openModal('addModal'); }
        function confirmAddAccount() {
            const bName=document.getElementById('newAccBand').value; const band=database.find(x=>x.name===bName); if(!band)return;
            if(document.getElementById('bulkModeToggle').checked) { document.getElementById('bulkInput').value.split('\n').forEach(l=>{ if(l.trim()){ let p=l.split(':'); band.accs.push({name:p[0].trim(), user:(p[1]||p[0]).trim(), pass:(p[2]||"").trim(), count:0, note:"", tag:"", id:'acc_'+Math.random(), originalBand:bName}); } }); }
            else { const n=document.getElementById('newAccName').value, u=document.getElementById('newAccUser').value, p=document.getElementById('newAccPass').value, c=document.getElementById('newAccCount').value; if(n&&u) band.accs.push({name:n, user:u, pass:p, count:parseInt(c)||0, note:"", tag:"", id:'acc_'+Math.random(), originalBand:bName}); }
            regenerateText(); Sounds.magic.play(); closeModals(); logToAll("🆕", `إضافة لـ ${bName}`);
        }
        function openTrash() { const d=document.getElementById('trashList'); d.innerHTML=trashBin.length?"":"فارغة"; trashBin.forEach(a=>d.innerHTML+=`<div style="display:flex;justify-content:space-between;padding:5px;border-bottom:1px solid #333"><span>${a.name}</span><button onclick="restore('${a.name}')">استرجاع</button></div>`); openModal('trashModal'); }
        function restore(n) { const idx=trashBin.findIndex(x=>x.name===n); if(idx>-1){ let a=trashBin[idx]; trashBin.splice(idx,1); let b=database.find(x=>x.name===a.originalBand)||database[0]; if(b) b.accs.push(a); regenerateText(); Sounds.magic.play(); closeModals(); } }
        function emptyTrash() { if(confirm("تفريغ؟")){trashBin=[]; regenerateText(); closeModals();} }
        function openDetails(id, bName) { const b=database.find(x=>x.name===bName); const a=b.accs.find(x=>x.id===id); document.getElementById('editAccId').value=JSON.stringify({id,bName}); document.getElementById('editNote').value=a.note; document.getElementById('editTag').value=a.tag; openModal('detailsModal'); }
        function saveDetails() { const m=JSON.parse(document.getElementById('editAccId').value); const b=database.find(x=>x.name===m.bName); const a=b.accs.find(x=>x.id===m.id); a.note=document.getElementById('editNote').value; a.tag=document.getElementById('editTag').value; regenerateText(); closeModals(); }
        function selectTag(c) { document.getElementById('editTag').value=c; }
        
        function killSwitch() { if(currentRole==='admin' && prompt("Password:")==="ELBADRAWY") { db.ref('maintenance_mode').set(true); alert("Locked"); location.reload(); } }
        function openTimeMachine() { if(currentRole==='admin') { db.ref('history').limitToLast(10).once('value', snap => { historyData = []; snap.forEach(s => historyData.push(s.val())); document.getElementById('historySlider').max = historyData.length-1; document.getElementById('historySlider').value = historyData.length-1; previewHistory(historyData.length-1); openModal('timeModal'); }); } }
        function previewHistory(i) { const d = historyData[i]; if(d) document.getElementById('historyDate').innerText = d.time; }
        function confirmRollback() { if(currentRole==='admin' && confirm("تأكيد؟")) { db.ref('shared_data').set(historyData[document.getElementById('historySlider').value].text); closeModals(); } }
        function openBroadcast() { if(currentRole==='admin') openModal('broadcastModal'); }
        function sendBroadcastAction() { if(currentRole==='admin') { db.ref('broadcast').set({text: document.getElementById('broadcastInput').value, time: Date.now()}); closeModals(); } }

        function logToAll(a, d) { const t = new Date().toLocaleString('ar-EG', {hour:'2-digit', minute:'2-digit'}); db.ref('system_logs').push({user: currentUser, action: a, details: d, time: t}); sendDiscord(`**[${currentUser}]** ${a}: ${d}`); }
        function sendDiscord(m) { fetch(DISCORD_WEBHOOK, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:"V45", content:m})}).catch(()=>{}); }
        function copy(t, s) { navigator.clipboard.writeText(t); if(s)Sounds[s].play(); }
        function copyAllCombos() { let t=""; database.forEach(b=>b.accs.forEach(a=>t+=`${a.user}:${a.pass}\n`)); copy(t,'magic'); }
        function smartPaste(i) { if(i.value.includes(':')){ let p=i.value.split(':'); i.value=p[0].trim(); document.getElementById('newAccPass').value=p[1].trim(); Sounds.magic.play(); } }
        function toggleBulkMode() { document.getElementById('addModal').classList.toggle('bulk-mode'); }
        function openEditor() { openModal('editorModal'); }
        function saveData() { db.ref('shared_data').set(document.getElementById('rawDataInput').value); closeModals(); }
        function openModal(id) { document.getElementById(id).style.display='block'; setTimeout(()=>document.getElementById(id).classList.add('active'),10); document.getElementById('overlay').style.display='block'; }
        function closeModals() { document.querySelectorAll('.modal').forEach(m=>{m.classList.remove('active'); setTimeout(()=>m.style.display='none',300);}); document.getElementById('overlay').style.display='none'; }
        document.onkeydown = function(evt) { if (evt.key === "Escape") closeModals(); if (evt.altKey && evt.key === 'n') { evt.preventDefault(); openAddModal(); } if (evt.altKey && evt.key === 'f') { evt.preventDefault(); document.getElementById('searchInput').focus(); } };
    </script>
</body>
</html>
